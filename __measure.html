<!doctype html><html class="w-mod-js" lang="zh"><head><meta charset="utf-8">
<link href="css/normalize.css" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  .section-2.partners-yellow { background-color: #f6c506; }
  .section-2.partners-yellow .grid img { width: 100%; max-width: 200px; height: auto; }
  @media screen and (min-width: 992px) {
    .section-2.partners-yellow .grid { display:flex; width:100%; justify-content:space-evenly; align-items:center; gap:24px; }
    .section-2.partners-yellow .grid img { width:200px; }
  }
  body{margin:0}
</style></head><body>
  <section class="section-2 partners-yellow">
    <div class="logo-label"><span style="color:#222;">+</span><strong class="bold-text-3">合作伙伴网络</strong></div>
    <div class="w-layout-grid grid">
      <a id="w-node-_10e9ba0f-2409-3881-8c33-b6a003be79b6-52632d4e" href="#" class="link-block-2 w-inline-block"><img src="images/partner-logo/2.svg" width="250" height="100"></a>
      <a id="w-node-edcdc99c-604b-acc5-0527-1dce943aa193-52632d4e" href="#" class="link-block-3 w-inline-block"><img src="images/partner-logo/1.svg" width="250" height="100"></a><img src="images/partner-logo/3.svg" width="250" height="100" id="w-node-_9afabcff-897b-2460-2505-d9f75c98e7f1-52632d4e"><img src="images/partner-logo/4.svg" width="250" height="100" id="w-node-_9afabcff-897b-2460-2505-d9f75c98e7f2-52632d4e">
    </div>
  </section>
  <pre id="out" style="font:14px monospace;padding:12px"></pre>
  <script>
    function r(el){var b=el.getBoundingClientRect();return {l:Math.round(b.left),r:Math.round(b.right),c:Math.round((b.left+b.right)/2)};}
    var grid=document.querySelector('.grid');var gm=getComputedStyle(grid);
    var o='display='+gm.display+' marginL='+gm.marginLeft+' marginR='+gm.marginRight+'\n';
    o+='grid '+JSON.stringify(r(grid))+'\n';
    var it=grid.children;for(var i=0;i<it.length;i++){o+='item'+i+' '+JSON.stringify(r(it[i]))+'\n';}
    document.getElementById('out').textContent=o;
  </script>
</body></html>
